# Политика линтинга проекта tg-music-bot.
#
# По ТЗ v3.0 (раздел 1) ошибки сторонних сервисов — Telegram API, S3, Redis,
# PostgreSQL, yt-dlp — обязаны гаситься в broad-except ветках
# (Graceful Degradation): бот не падает, а логирует и деградирует, поэтому
# `except Exception:` — осознанная и обязательная конструкция проекта.
# BLE001 отключён; по-настоящему «слепой» except всё ещё ловится правилом
# E722 (bare except), а пустые ветки обработки — S110 (требуют логирования).
# Остальные правила остаются включёнными в полном объёме.

[lint]
ignore = ["BLE001"]
