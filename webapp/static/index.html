<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Музыка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/app/static/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="search-row">
      <input id="searchInput" type="search" autocomplete="off"
             placeholder="Название трека или ссылка (Spotify, YouTube, Яндекс…)">
      <button id="searchBtn" class="icon-btn" title="Искать">🔍</button>
    </div>
    <nav id="tabs">
      <button class="tab active" data-tab="search">Поиск</button>
      <button class="tab" data-tab="playlists">Плейлисты</button>
      <button class="tab" data-tab="favorites">Избранное</button>
      <button class="tab" data-tab="top">Топ</button>
    </nav>
  </header>

  <main id="content"></main>
</div>

<!-- Мини-плеер -->
<div id="miniPlayer" class="hidden">
  <div class="mp-progress"><div id="mpBar"></div></div>
  <div class="mp-inner">
    <div class="mp-info" id="mpInfo">
      <div id="mpTitle" class="mp-title">—</div>
      <div id="mpArtist" class="mp-artist">—</div>
    </div>
    <button id="mpPlay" class="icon-btn">▶️</button>
    <button id="mpNext" class="icon-btn">⏭</button>
    <button id="mpExpand" class="icon-btn">⌃</button>
  </div>
</div>

<!-- Полноэкранный плеер -->
<div id="fullPlayer" class="overlay hidden">
  <div class="fp-top">
    <button id="fpCollapse" class="icon-btn">⌄</button>
    <button id="fpLyrics" class="icon-btn" title="Текст">📝</button>
    <button id="fpRadio" class="icon-btn" title="Радио">📻</button>
  </div>
  <div class="fp-cover" id="fpCover">🎵</div>
  <div class="fp-title" id="fpTitle">—</div>
  <div class="fp-artist" id="fpArtist">—</div>
  <div class="fp-seek">
    <span id="fpCur">0:00</span>
    <input id="fpSeek" type="range" min="0" max="1000" value="0">
    <span id="fpDur">0:00</span>
  </div>
  <div class="fp-controls">
    <button id="fpShuffle" class="icon-btn">🔀</button>
    <button id="fpPrev" class="icon-btn">⏮</button>
    <button id="fpPlay" class="icon-btn big">▶️</button>
    <button id="fpNext" class="icon-btn">⏭</button>
    <button id="fpRepeat" class="icon-btn">🔁</button>
  </div>
  <div class="fp-volume">
    <span>🔈</span>
    <input id="fpVolume" type="range" min="0" max="100" value="100">
  </div>
  <div id="fpQueue" class="fp-queue"></div>
</div>

<!-- Караоке / текст -->
<div id="lyricsModal" class="overlay hidden">
  <div class="lm-top">
    <div class="lm-head">
      <div id="lmTitle" class="mp-title">Текст</div>
      <div id="lmArtist" class="mp-artist"></div>
    </div>
    <button id="lmClose" class="icon-btn">✕</button>
  </div>
  <div id="lyricsBody" class="lyrics-body"></div>
</div>

<!-- Шторка выбора плейлиста -->
<div id="sheet" class="overlay sheet hidden">
  <div class="sheet-card">
    <div class="sheet-title">Добавить в плейлист</div>
    <div id="sheetList"></div>
    <button id="sheetCancel" class="btn">Отмена</button>
  </div>
</div>

<div id="toast" class="hidden"></div>
<audio id="audio" preload="auto"></audio>
<script src="/app/static/app.js"></script>
</body>
</html>
