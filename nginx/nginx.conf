events {
    worker_connections 1024;
}

http {
    upstream musicbot {
        server musicbot:8080;
    }

    # Rate limiting для защиты от DDoS
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;

    server {
        listen 80;
        server_name _;

        # Перенаправление HTTP на HTTPS (если SSL включён)
        # return 301 https://$host$request_uri;

        # Webhook endpoint
        location /webhook {
            limit_req zone=webhook_limit burst=50 nodelay;
            proxy_pass http://musicbot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Web App
        location /app/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://musicbot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API endpoints
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://musicbot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Healthcheck
        location /healthz {
            proxy_pass http://musicbot;
            access_log off;
        }

        # Healthcheck для самого nginx
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # HTTPS сервер (раскомментировать после получения SSL сертификата)
