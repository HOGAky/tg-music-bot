events {
    worker_connections 1024;
}

http {
    upstream musicbot {
        server musicbot:8080;
    }

    # Rate limiting для защиты от DDoS
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;

    # HTTP: ACME-challenge + редирект на HTTPS
    server {
        listen 80;
        server_name _;

        # Let's Encrypt HTTP-01 (продление без остановки nginx)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /healthz {
            proxy_pass http://musicbot;
            access_log off;
        }

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: Mini App + webhook + API
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/ssl/live/84.201.167.96.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/84.201.167.96.sslip.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /webhook {
            limit_req zone=webhook_limit burst=50 nodelay;
            proxy_pass http://musicbot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /app/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://musicbot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://musicbot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /healthz {
            proxy_pass http://musicbot;
            access_log off;
        }
    }
}
