worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    upstream musicbot {
        server musicbot:8080;
        keepalive 64;
    }

    # Rate limiting для защиты от DDoS (ТЗ v2.0)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=60r/s;

    # HTTP: ACME-challenge + редирект на HTTPS
    server {
        listen 80;
        server_name _;

        # Let's Encrypt HTTP-01 (продление без остановки nginx)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /healthz {
            proxy_pass http://musicbot;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: Mini App + webhook + API
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/ssl/live/84.201.167.96.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/84.201.167.96.sslip.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /webhook {
            limit_req zone=webhook_limit burst=50 nodelay;
            proxy_pass http://musicbot;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # таймауты соединения с приложением (ТЗ v3.0, п. 3.3)
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503;
        }

        location /app/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://musicbot;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_buffering off;  # стриминг mp3-ответов в веб-плеер
        }

        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://musicbot;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /healthz {
            proxy_pass http://musicbot;
            access_log off;
        }
    }
}
